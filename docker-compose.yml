services:
  app:
    # `image:` lets `docker compose pull` fetch a prebuilt image (pushed by
    # CI to ghcr.io); `build:` stays so a manual `docker compose build` still
    # works for local/on-box testing without needing CI.
    image: ghcr.io/dzekuza/pceuropa:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_ENABLE_REACT_GRAB: ${NEXT_PUBLIC_ENABLE_REACT_GRAB}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Full DATABASE_URL is set in the .env file next to this compose file,
      # kept as one opaque value here rather than assembled from
      # POSTGRES_USER/PASSWORD/DB parts, so it's a single thing to rotate.
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_ROOT: /data/uploads
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      MAINTENANCE_PASSWORD: ${MAINTENANCE_PASSWORD}
      MODERAN_API_TOKEN: ${MODERAN_API_TOKEN}
      MODERAN_DOMAIN_ID: ${MODERAN_DOMAIN_ID}
      MODERAN_PROPERTYSET_ID: ${MODERAN_PROPERTYSET_ID}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host - only `app` and operator `docker exec`
    # (for migrations/backups) need to reach it.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
